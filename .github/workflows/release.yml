name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Validate tag and package version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          tag_ref="refs/tags/$tag"
          git show-ref --verify --quiet "$tag_ref"
          commit="$(git rev-parse --verify "${tag_ref}^{commit}")"
          test "$(git rev-parse HEAD)" = "$commit"
          version="${tag#v}"
          package_version="${version%%-*}"
          grep -Eq "project\(polymarket_cpp_client VERSION ${package_version//./\\.} LANGUAGES" CMakeLists.txt
          grep -Fq "#define POLYMARKET_CLIENT_VERSION \"$package_version\"" include/polymarket/version.hpp
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: validate
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DPOLYMARKET_CLIENT_BUILD_EXAMPLES=ON \
            -DPOLYMARKET_CLIENT_BUILD_TESTS=ON \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Build
        run: cmake --build build --parallel --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure --build-config Release -LE live

      - name: Install
        run: cmake --install build

      - name: Package
        run: |
          test "$(uname -m)" = arm64
          archive_count=0
          while IFS= read -r archive; do
            archive_count=$((archive_count + 1))
            minos="$(otool -l "$archive" | awk '/minos/{print $2}' | sort -u)"
            test "$minos" = 12.0 || {
              echo "Unexpected deployment target in $archive: $minos" >&2
              exit 1
            }
          done < <(find "${{ github.workspace }}/install/lib" -name '*.a' -type f -print)
          test "$archive_count" -gt 0
          cd ${{ github.workspace }}/install
          tar -czvf ../polymarket-cpp-client-macos-arm64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64
          path: polymarket-cpp-client-macos-arm64.tar.gz
          compression-level: 0
          if-no-files-found: error

  build-linux:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOLYMARKET_CLIENT_BUILD_EXAMPLES=ON \
            -DPOLYMARKET_CLIENT_BUILD_TESTS=ON \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Build
        run: cmake --build build --parallel --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure --build-config Release -LE live

      - name: Install
        run: cmake --install build

      - name: Package
        run: |
          test "$(uname -m)" = x86_64
          cd ${{ github.workspace }}/install
          tar -czvf ../polymarket-cpp-client-linux-x64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64
          path: polymarket-cpp-client-linux-x64.tar.gz
          compression-level: 0
          if-no-files-found: error

  release:
    needs: [validate, build-macos, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Release ${{ needs.validate.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            artifacts/macos-arm64/polymarket-cpp-client-macos-arm64.tar.gz
            artifacts/linux-x64/polymarket-cpp-client-linux-x64.tar.gz
